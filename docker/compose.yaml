name: quality-monitoring-system

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-QualiBoard}
  DEBUG: ${DEBUG:-false}
  MONGODB_URL: ${MONGODB_URL:-mongodb://10.17.154.252:27019}
  MONGODB_DB_NAME: ${MONGODB_DB_NAME:-quality_monitoring}
  DATA_GATEWAY_URL: ${DATA_GATEWAY_URL:-http://10.17.154.65:8020}
  DATA_GATEWAY_TIMEOUT_SECONDS: ${DATA_GATEWAY_TIMEOUT_SECONDS:-120}
  PROCESS_RECORD_CREDENTIAL_KEY: ${PROCESS_RECORD_CREDENTIAL_KEY:-}
  DATA_GATEWAY_CACHE_TTL_SECONDS: ${DATA_GATEWAY_CACHE_TTL_SECONDS:-10.0}
  JWT_SECRET: ${JWT_SECRET:-}
  ALERT_TOKEN_SECRET: ${ALERT_TOKEN_SECRET:-}
  DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  CORS_ORIGINS: '["${FRONTEND_ORIGIN:-http://localhost:4000}"]'
  APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://apps.1oa.com.cn/QualiBoard}
  MAIL_PROXY_URL: ${MAIL_PROXY_URL:-https://one.1oa.com.cn/springboard/api/v1/integrations/mail/app}
  MAIL_PROXY_TOKEN: ${MAIL_PROXY_TOKEN:-}
  LOG_DIR: /app/logs
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON_FORMAT: ${LOG_JSON_FORMAT:-false}
  TZ: ${TZ:-Asia/Shanghai}

services:
  backend:
    image: quality-monitoring-backend:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      network: host
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-4001}:8000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    image: quality-monitoring-frontend:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      network: host
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-4000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    init: true
    restart: unless-stopped
    networks:
      - app_network

  init-config:
    image: quality-monitoring-backend:local
    profiles: ["tools"]
    environment: *backend-environment
    command: ["python", "init_default_settings.py"]
    restart: "no"
    networks:
      - app_network

volumes:
  backend_logs:

networks:
  app_network:
    driver: bridge
