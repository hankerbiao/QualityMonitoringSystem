<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>实时语音识别 Demo</title>
    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 40px auto; }
        #result { margin-top: 20px; padding: 20px; background: #f0f4f8;
                  min-height: 120px; border-radius: 8px; font-size: 18px; line-height: 1.8; white-space: pre-wrap; }
        button { padding: 10px 28px; font-size: 16px; margin: 5px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { color: #666; margin: 10px 0; }
        #status.error { color: #e53e3e; }
        #status.success { color: #38a169; }
        .log-box { margin-top: 20px; padding: 12px; background: #1a1a2e; color: #a0f0a0;
                   border-radius: 8px; font-family: monospace; font-size: 12px;
                   max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Paraformer 实时语音识别</h2>
    <div id="status">未连接</div>
    <button id="startBtn">开始录音</button>
    <button id="stopBtn" disabled>停止</button>
    <div id="result"></div>
    <div class="log-box" id="logBox">[日志]</div>

    <script>
        const WS_URL = 'ws://10.17.150.235:10095';
        let ws, audioContext, mediaStream, source, processor;

        const startBtn = document.getElementById('startBtn');
        const stopBtn  = document.getElementById('stopBtn');
        const resultDiv = document.getElementById('result');
        const statusDiv = document.getElementById('status');
        const logBox = document.getElementById('logBox');

        function log(msg) {
            const ts = new Date().toLocaleTimeString();
            const line = `[${ts}] ${msg}`;
            console.log(line);
            logBox.textContent += line + '\n';
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setStatus(text, type = '') {
            statusDiv.textContent = text;
            statusDiv.className = type;
        }

        function resetUI() {
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        startBtn.onclick = async () => {
            log('>>> 点击开始录音');
            startBtn.disabled = true;
            resultDiv.textContent = '';
            stopBtn.disabled = true;

            ws = new WebSocket(WS_URL);
            log(`[WS] 正在连接 ${WS_URL}...`);

            ws.onopen = async () => {
                log('[WS] ✓ 连接已建立');
                setStatus('已连接，请说话...', 'success');

                try {
                    log('[Mic] 请求麦克风权限...');
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { channelCount: 1, sampleRate: 16000 }
                    });
                    log('[Mic] ✓ 麦克风已获取，16kHz 单声道');

                    audioContext = new AudioContext({ sampleRate: 16000 });
                    source = audioContext.createMediaStreamSource(mediaStream);

                    // bufferSize=4096 → 256ms@16kHz
                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    let frameCount = 0;

                    processor.onaudioprocess = (e) => {
                        const float32 = e.inputBuffer.getChannelData(0);
                        const pcm16 = new Int16Array(float32.length);
                        for (let i = 0; i < float32.length; i++) {
                            let s = Math.max(-1, Math.min(1, float32[i]));
                            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(pcm16.buffer);
                            frameCount++;
                            if (frameCount % 10 === 0) {
                                log(`[Audio] 已发送 ${frameCount} 帧 PCM 数据`);
                            }
                        }
                    };

                    source.connect(processor);
                    const silentGain = audioContext.createGain();
                    silentGain.gain.value = 0;
                    processor.connect(silentGain);
                    silentGain.connect(audioContext.destination);

                    stopBtn.disabled = false;
                    log('[UI] 停止按钮已启用');
                } catch (err) {
                    log(`[Mic] ✗ 麦克风获取失败: ${err.message}`);
                    setStatus('麦克风权限被拒绝', 'error');
                    resetUI();
                }
            };

            ws.onmessage = (e) => {
                log(`[WS] 收到原始数据: ${e.data}`);
                try {
                    const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                    log(`[WS] 解析后: ${JSON.stringify(data)}`);

                    if (data.text) {
                        resultDiv.textContent += data.text;
                        log(`[Result] 追加文本: "${data.text}"`);
                    }
                    if (data.is_final) {
                        log('[WS] 服务端返回最终结果 (is_final=true)');
                        resultDiv.textContent = data.text || resultDiv.textContent;
                        // 等待 300ms 让服务端完成最终处理再关闭
                        setTimeout(() => {
                            log('[WS] 延迟后自动关闭连接');
                            if (ws) ws.close();
                        }, 300);
                    }
                    if (data.complete) {
                        log('[WS] 服务端标记识别完成 (complete=true)');
                        setTimeout(() => {
                            if (ws) ws.close();
                        }, 300);
                    }
                } catch (err) {
                    log(`[WS] ✗ JSON 解析失败: ${err.message}, raw: ${e.data}`);
                }
            };

            ws.onclose = (e) => {
                log(`[WS] 连接关闭 (code=${e.code}, reason="${e.reason || '无'}")`);
                setStatus('连接已断开', '');
                resetUI();
                isStopping = false;
            };

            ws.onerror = (e) => {
                log(`[WS] ✗ 连接出错`);
                setStatus('连接出错，请检查服务器地址', 'error');
                resetUI();
            };
        };

        let isStopping = false;

        stopBtn.onclick = () => {
            if (isStopping) return;
            isStopping = true;
            log('>>> 点击停止录音');
            stopBtn.disabled = true;

            // 先断开音频采集（不再发送新数据）
            if (processor)  { processor.disconnect(); processor = null; log('[Audio] processor 已断开'); }
            if (source)     { source.disconnect(); source = null; log('[Audio] source 已断开'); }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; log('[Mic] 麦克风已停止'); }
            if (audioContext) { audioContext.close(); audioContext = null; log('[Audio] audioContext 已关闭'); }

            // 等待 500ms 让缓冲区数据发送完毕，再发 end
            log('[WS] 等待 500ms 后发送 end...');
            setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    log('[WS] 发送 { type: "end" }');
                    ws.send(JSON.stringify({ type: 'end' }));
                    // 再等 2 秒收最终结果
                    log('[WS] 等待 2 秒接收服务端最终结果...');
                    setTimeout(() => {
                        log('[WS] 超时，强制关闭连接');
                        if (ws) ws.close();
                        resetUI();
                        setStatus('已停止', '');
                        isStopping = false;
                    }, 2000);
                } else {
                    log(`[WS] 无需发送 end (readyState=${ws ? ws.readyState : 'undefined'})`);
                    resetUI();
                    setStatus('已停止', '');
                    isStopping = false;
                }
            }, 500);
        };
    </script>
</body>
</html>
